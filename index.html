<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <title>Minesweeper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">

            <div class="title-section">
                <div class="bomb-icon">💣</div>

                <div>
                    <h1>Minesweeper</h1>
                    <p>Clear the board without hitting a mine.</p>
                </div>
            </div>

            <div class="stats">

                <div class="stat-box">
                    <span class="stat-label">MINES</span>
                    <span id="mine-counter">20</span>
                </div>

                <div class="stat-box">
                    <span class="stat-label">TIME</span>
                    <span id="timer">00:00</span>
                </div>

            </div>

        </header>


        <section class="game-card">

            <div id="status-bar" class="status-bar">
                <span id="status-icon">💣</span>
                <span id="status-text">Clear the board!</span>
            </div>


            <div
                id="board"
                class="board"
                aria-label="Minesweeper board"
            ></div>


            <div class="controls">

                <button
                    id="flag-mode-button"
                    class="control-button"
                    type="button"
                >
                    🚩 Flag Mode: OFF
                </button>

                <button
                    id="restart-button"
                    class="control-button secondary"
                    type="button"
                >
                    ↻ New Game
                </button>

            </div>


            <div class="instructions">

                <div class="instruction desktop-instruction">
                    <strong>🖱️ Desktop</strong>
                    <span>Left click to reveal · Right click to flag</span>
                </div>

                <div class="instruction mobile-instruction">
                    <strong>📱 Mobile</strong>
                    <span>Tap to reveal · Turn on Flag Mode to flag</span>
                </div>

            </div>

        </section>


        <div
            id="result-overlay"
            class="result-overlay hidden"
        >

            <div class="result-card">

                <div id="result-icon" class="result-icon">
                    🎉
                </div>

                <h2 id="result-title">
                    You Won!
                </h2>

                <p id="result-message">
                    You cleared the board!
                </p>

                <div class="result-stats">

                    <div>
                        <span>TIME</span>
                        <strong id="final-time">00:00</strong>
                    </div>

                    <div>
                        <span>MINES</span>
                        <strong id="final-mines">20</strong>
                    </div>

                </div>

                <button
                    id="result-restart"
                    class="result-button"
                    type="button"
                >
                    Play Again
                </button>

            </div>

        </div>

    </main>

    <script src="game.js"></script>

</body>
</html>
